name: Demo Python
on:
  push:
    paths:
      - 'demo_python/**'
      - '.github/workflows/demo-python.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'demo_python/**'
      - '.github/workflows/demo-python.yml'
      - 'requirements.txt'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s demo_python -v
      - run: python demo_python/capturas.py
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-juego
          path: capturas/*.png
